  <!-- Tailwind CSS & HLS.js -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000000 !important;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Video Aspect Modes */
    video.mode-contain {
      object-fit: contain !important;
      width: 100% !important;
      height: 100% !important;
    }
    video.mode-fill {
      object-fit: fill !important;
      width: 100% !important;
      height: 100% !important;
    }
    video.mode-cover {
      object-fit: cover !important;
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100% !important;
      height: 100% !important;
    }
    video.mode-16-9 {
      object-fit: fill !important;
      aspect-ratio: 16/9 !important;
      width: 100% !important;
      height: 100% !important;
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar { width: 2px; height: 2px; }
    ::-webkit-scrollbar-track { background: #000; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 999px; }

    /* Brand typography glow */
    .brand-glow {
      text-shadow: 0 0 25px rgba(239, 68, 68, 0.45);
    }

    /* Fullscreen & True Landscape styles */
    :fullscreen #playerContainer,
    :-webkit-full-screen #playerContainer {
      width: 100vw !important;
      height: 100vh !important;
    }

    /* Fallback Virtual Landscape Rotation */
    .virtual-landscape {
      transform: rotate(90deg) !important;
      transform-origin: center center !important;
      width: 100vh !important;
      height: 100vw !important;
      position: fixed !important;
      top: calc((100vh - 100vw) / 2) !important;
      left: calc((100vw - 100vh) / 2) !important;
      z-index: 50 !important;
    }
    .virtual-landscape video {
      width: 100% !important;
      height: 100% !important;
    }

    /* Layer Stacking Order (Z-Index Architecture) */
    #videoPlayer {
      position: relative;
      z-index: 1;
    }
    #gestureZone {
      position: absolute;
      inset: 0;
      z-index: 10;
      touch-action: none;
      -webkit-touch-callout: none;
    }
    #centerBrand {
      z-index: 15;
    }
    #hudBrightness, #hudVolume {
      z-index: 25;
    }
    #toast {
      z-index: 28;
    }
    #controlsOverlay {
      position: absolute;
      inset: 0;
      z-index: 40 !important;
      pointer-events: none !important;
    }
    #controlsOverlay button,
    #controlsOverlay a,
    #qualityMenu {
      pointer-events: auto !important;
      position: relative;
      z-index: 45 !important;
    }

    /* Drawer Width: Quarter Screen Only (ربع الشاشة فقط دائماً) */
    #groupsDrawer {
      position: fixed;
      top: 0;
      bottom: 0;
      right: 0;
      width: 25% !important;
      max-width: 25% !important;
      min-width: 160px;
      z-index: 100 !important;
      pointer-events: auto !important;
      background-color: rgba(0, 0, 0, 0.96);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      transform: translateX(100%) !important;
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #groupsDrawer.drawer-open {
      transform: translateX(0) !important;
    }

    @media (orientation: landscape) {
      #groupsDrawer {
        width: 25vw !important;
        max-width: 25vw !important;
        min-width: 200px;
      }
    }
    .virtual-landscape #groupsDrawer {
      width: 25vh !important;
      max-width: 25vh !important;
      min-width: 200px;
    }
  </style>
</head>
<body class="bg-black text-white w-screen h-screen overflow-hidden flex flex-col justify-center items-center relative">

  <!-- ================= MAIN PLAYER CONTAINER ================= -->
  <div id="playerContainer" class="relative w-full h-full bg-black flex items-center justify-center overflow-hidden">
    
    <!-- Video Element -->
    <video 
      id="videoPlayer" 
      class="mode-contain w-full h-full bg-black transition-all duration-150" 
      playsinline 
      webkit-playsinline 
      x5-playsinline 
      autoplay
      preload="auto"
    ></video>

    <!-- Center Brand: AlameeereLive (يختفي فقط عند بدء تشغيل الفيديو فعلياً) -->
    <div id="centerBrand" class="absolute inset-0 pointer-events-none flex flex-col items-center justify-center transition-opacity duration-500">
      <div class="flex items-center gap-2.5 px-6 py-3 rounded-2xl bg-black/80 backdrop-blur-md border border-neutral-800 shadow-2xl brand-glow">
        <div class="w-3 h-3 rounded-full bg-red-600 animate-pulse"></div>
        <h1 class="text-2xl sm:text-3xl font-black tracking-wider uppercase">
          <span class="text-white">Alameeere</span><span class="text-red-600">Live</span>
        </h1>
      </div>
    </div>

    <!-- Loading / Fast Buffering Indicator -->
    <div id="spinner" class="hidden absolute inset-0 pointer-events-none flex items-center justify-center bg-black/30 z-20">
      <div class="w-9 h-9 border-2 border-neutral-700 border-t-red-600 rounded-full animate-spin"></div>
    </div>

    <!-- HUD Overlay for Gestures: Brightness (Left) & Volume (Right) -->
    <div id="hudBrightness" class="absolute left-6 top-1/2 -translate-y-1/2 bg-black/85 backdrop-blur-md border border-neutral-800 text-white px-3 py-4 rounded-2xl flex flex-col items-center gap-2 opacity-0 pointer-events-none transition-opacity duration-200 shadow-2xl">
      <span class="text-amber-400 text-base">☀️</span>
      <div class="w-1.5 h-24 bg-neutral-800 rounded-full overflow-hidden flex flex-col justify-end">
        <div id="hudBrightnessBar" class="w-full bg-amber-400 rounded-full transition-all duration-75" style="height: 100%;"></div>
      </div>
      <span id="hudBrightnessVal" class="text-[10px] font-mono text-neutral-300">100%</span>
    </div>

    <div id="hudVolume" class="absolute right-6 top-1/2 -translate-y-1/2 bg-black/85 backdrop-blur-md border border-neutral-800 text-white px-3 py-4 rounded-2xl flex flex-col items-center gap-2 opacity-0 pointer-events-none transition-opacity duration-200 shadow-2xl">
      <span id="hudVolumeIcon" class="text-sky-400 text-base">🔊</span>
      <div class="w-1.5 h-24 bg-neutral-800 rounded-full overflow-hidden flex flex-col justify-end">
        <div id="hudVolumeBar" class="w-full bg-sky-400 rounded-full transition-all duration-75" style="height: 100%;"></div>
      </div>
      <span id="hudVolumeVal" class="text-[10px] font-mono text-neutral-300">100%</span>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="absolute top-14 right-1/2 translate-x-1/2 pointer-events-none opacity-0 transition-opacity duration-300 bg-neutral-900/95 border border-neutral-800 text-white text-xs px-3 py-1.5 rounded-full shadow-2xl flex items-center gap-2">
      <span id="toastMsg">--</span>
    </div>

    <!-- ================= FULLSCREEN TOUCH & GESTURE LAYER ================= -->
    <div id="gestureZone"></div>

    <!-- ================= CONTROLS OVERLAY ================= -->
    <div id="controlsOverlay" class="transition-opacity duration-300 flex flex-col justify-between p-3 sm:p-4" style="padding-top: max(12px, var(--sat)); padding-bottom: max(12px, var(--sab)); padding-left: max(12px, var(--sal)); padding-right: max(12px, var(--sar));">
      
      <!-- Top Bar: في الركن الأيمن اسم القناة وشعارها | في الركن الأيسر الأيقونات الثلاثة كرموز فقط -->
      <div class="flex items-center justify-between w-full pointer-events-none">
        
        <!-- الركن الأيمن: شعار واسم القناة فقط (يظهر فقط عند بدء تشغيل القناة) -->
        <div id="channelHeader" class="flex items-center gap-2 overflow-hidden max-w-[60%] opacity-0 transition-opacity duration-200 pointer-events-auto">
          <div id="activeLogoContainer" class="w-7 h-7 sm:w-8 sm:h-8 rounded-lg bg-neutral-950 border border-neutral-800 p-0.5 flex items-center justify-center shrink-0 overflow-hidden shadow">
            <span id="activeLogoFallback" class="text-xs">📺</span>
            <img id="activeLogoImg" src="" class="w-full h-full object-contain hidden" alt="logo" onerror="this.classList.add('hidden'); document.getElementById('activeLogoFallback').classList.remove('hidden');">
          </div>
          <span id="channelTitle" class="text-xs sm:text-sm font-bold text-white truncate"></span>
        </div>

        <!-- الركن الأيسر: الأيقونات الثلاثة كرموز فقط (بدون أي نصوص عربية) -->
        <div class="flex items-center gap-1.5 sm:gap-2 pointer-events-auto">

          <button 
            id="btnToggleGroups" 
            onclick="toggleGroupsDrawer(event)" 
            class="w-9 h-9 rounded-xl bg-neutral-900/95 hover:bg-neutral-800 border border-neutral-700/80 text-white flex items-center justify-center transition active:scale-95 shadow cursor-pointer"

    // Set Stream Quality مع تسريع الفتح والحد من أي تأخير
    function setStreamQuality(qualityObj, isAutoInitial = false) {
      activeQuality = qualityObj;
      spinner.classList.remove('hidden');
      const streamUrl = buildStreamUrl(qualityObj.id);

      if (hls) {
        hls.destroy();
        hls = null;
      }

      if (Hls.isSupported()) {
        hls = new Hls({
          enableWorker: true,
          lowLatencyMode: true,
          backBufferLength: 60,
          manifestLoadingTimeOut: 15000,
          manifestLoadingMaxRetry: 4,
          levelLoadingTimeOut: 15000,
          fragLoadingTimeOut: 20000
        });
        
        hls.attachMedia(video);
        hls.loadSource(streamUrl);

        video.play().catch(() => {
          video.muted = true;
          video.play().catch(() => {});
        });

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play().catch(() => {});
          if (!isAutoInitial) showToast(qualityObj.label);
        });

        hls.on(Hls.Events.FRAG_LOADED, () => {
          if (video.paused) video.play().catch(() => {});
        });

        hls.on(Hls.Events.FRAG_BUFFERED, () => {
          if (video.paused) video.play().catch(() => {});
        });

        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            switch (data.type) {
              case Hls.ErrorTypes.NETWORK_ERROR:
                console.log('Network error, attempting recovery...');
                hls.startLoad();
                break;
              case Hls.ErrorTypes.MEDIA_ERROR:
                console.log('Media error, recovering...');
                hls.recoverMediaError();
                break;
              default:
                hls.destroy();
                spinner.classList.add('hidden');
                break;
            }
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = streamUrl;
        video.addEventListener('loadedmetadata', () => {
          video.play().catch(() => {});
        });
      }

      updateQualityMenuUI();
      qualityMenu.classList.add('hidden');
    }

    // ================= أحداث اللمس الفورية والدوران والإيماءات =================
    // الطبقة gestureZone تلتقط اللمسات في المساحة الحرة خارج الأزرار
    let touchStartX = 0;
    let touchStartY = 0;
    let touchStartVol = 1.0;
    let touchStartBri = 1.0;
    let isTouching = false;
    let isSwiping = false;
    let touchSide = 'right';
    let lastTapTime = 0;
    let lastTapX = 0;
    let lastTapY = 0;
    let singleTapTimer = null;
    let hudHideTimer = null;

    gestureZone.addEventListener('touchstart', (e) => {
      if (e.touches.length !== 1) return;
      const t = e.touches[0];
      const rect = gestureZone.getBoundingClientRect();
      touchStartX = t.clientX - rect.left;
      touchStartY = t.clientY - rect.top;
      touchStartVol = video.volume;
      touchStartBri = currentBrightness;
      isTouching = true;
      isSwiping = false;

      // اليمين: صوت | اليسار: إضاءة
      touchSide = touchStartX > (rect.width / 2) ? 'right' : 'left';
    }, { passive: true });

    gestureZone.addEventListener('touchmove', (e) => {
      if (!isTouching || e.touches.length !== 1) return;
      const t = e.touches[0];
      const rect = gestureZone.getBoundingClientRect();
      const currentY = t.clientY - rect.top;
      const deltaY = touchStartY - currentY;

      if (Math.abs(deltaY) > 8) {
        isSwiping = true;
        clearTimeout(hudHideTimer);

        if (touchSide === 'right') {
          // سحب اليمين: رفع وخفض الصوت
          let newVol = Math.min(1, Math.max(0, touchStartVol + (deltaY / (rect.height * 0.7))));
          video.volume = newVol;
          video.muted = (newVol === 0);
          updateVolumeUI();
          
          hudVolume.style.opacity = '1';
          hudVolumeBar.style.height = `${Math.round(newVol * 100)}%`;
          hudVolumeVal.textContent = `${Math.round(newVol * 100)}%`;
        } else {
          // سحب اليسار: رفع وخفض الإضاءة
          let newBri = Math.min(1.5, Math.max(0.15, touchStartBri + (deltaY / (rect.height * 0.8))));
          currentBrightness = newBri;
          video.style.filter = `brightness(${newBri})`;
          
          hudBrightness.style.opacity = '1';
          hudBrightnessBar.style.height = `${Math.min(100, Math.round((newBri / 1.5) * 100))}%`;
          hudBrightnessVal.textContent = `${Math.round(newBri * 100)}%`;
        }
      }
    }, { passive: true });

    gestureZone.addEventListener('touchend', (e) => {
      if (!isTouching) return;
      isTouching = false;

      hudHideTimer = setTimeout(() => {
        hudBrightness.style.opacity = '0';
        hudVolume.style.opacity = '0';
      }, 500);

      if (!isSwiping) {
        const now = Date.now();
        const dist = Math.hypot(touchStartX - lastTapX, touchStartY - lastTapY);

        if (now - lastTapTime < 320 && dist < 35) {
          // نقرتين متتاليتين في أي مكان على المشغل: دوران الشاشة فوراً
          clearTimeout(singleTapTimer);
          lastTapTime = 0;
          toggleOrientation();
        } else {
          // نقرة واحدة: إظهار أو إخفاء عناصر التحكم
          lastTapTime = now;
          lastTapX = touchStartX;
          lastTapY = touchStartY;
          singleTapTimer = setTimeout(() => {
            toggleControls();
          }, 260);
        }
      }
    }, { passive: true });

    // أحداث الفيديو
    video.addEventListener('playing', () => {
      spinner.classList.add('hidden');
      centerBrand.classList.add('opacity-0');
      iconPlay.classList.add('hidden');
      iconPause.classList.remove('hidden');
      resetControlsTimer();
    });

    video.addEventListener('waiting', () => {
      spinner.classList.remove('hidden');
    });

    video.addEventListener('pause', () => {
      iconPlay.classList.remove('hidden');
      iconPause.classList.add('hidden');
      resetControlsTimer();
    });

    // تهيئة أولية
    renderDrawerGroups();
    renderDrawerChannels(0);
    resetControlsTimer();
  </script>
</body>
</html>

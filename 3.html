<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AlameeereTV - المشغل المتطور</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000000 !important;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    
    /* Video Aspect Modes */
    video.mode-contain {
      object-fit: contain !important;
      aspect-ratio: auto !important;
      width: 100vw;
      height: 100vh;
    }
    video.mode-fill {
      object-fit: fill !important;
      aspect-ratio: auto !important;
      width: 100vw;
      height: 100vh;
    }
    video.mode-cover {
      /* تجاوز حدود الكاميرا والنوتش بحرية تامة */
      object-fit: cover !important;
      aspect-ratio: auto !important;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100vw !important;
      height: 100vh !important;
      max-width: none !important;
      max-height: none !important;
    }
    video.mode-16-9 {
      object-fit: fill !important;
      aspect-ratio: 16/9 !important;
      width: 100vw;
      height: 100vh;
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #0a0a0a; }
    ::-webkit-scrollbar-thumb { background: #262626; border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: #404040; }

    /* Brand Glow Animations */
    .brand-glow {
      background: linear-gradient(135deg, #ffffff 0%, #a1a1aa 50%, #ffffff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 24px rgba(255, 255, 255, 0.35);
    }
    .red-glow {
      box-shadow: 0 0 20px rgba(220, 38, 38, 0.45);
    }
  </style>
</head>
<body class="bg-black text-white w-screen h-screen overflow-hidden flex flex-col justify-center items-center relative">

  <!-- ================= VIDEO ELEMENT ================= -->
  <div id="playerContainer" class="relative w-full h-full bg-black flex items-center justify-center overflow-hidden">
    <video 
      id="videoPlayer" 
      class="mode-contain w-full h-full bg-black transition-all duration-200" 
      playsinline 
      webkit-playsinline 
      x5-playsinline 
      autoplay
    ></video>

    <!-- Heart of Player Brand Logo (في قلب المشغل) -->
    <div id="centerBrand" class="absolute inset-0 pointer-events-none flex flex-col items-center justify-center transition-opacity duration-500 z-10">
      <div class="flex items-center gap-2 px-5 py-2.5 rounded-2xl bg-black/50 backdrop-blur-md border border-neutral-800/80 shadow-2xl">
        <span class="text-red-500 font-extrabold text-2xl tracking-wider">▲</span>
        <h1 class="brand-glow text-2xl sm:text-3xl font-black tracking-widest uppercase">AlameeereTV</h1>
      </div>
      <p id="centerSubtext" class="text-neutral-400 text-xs mt-2 font-medium">اختر قناة لبدء البث المباشر</p>
    </div>

    <!-- Loading / Status Spinner -->
    <div id="spinner" class="hidden absolute inset-0 pointer-events-none flex items-center justify-center z-20 bg-black/40">
      <div class="w-12 h-12 border-4 border-neutral-700 border-t-red-600 rounded-full animate-spin"></div>
    </div>

    <!-- On-Screen Notification Toast (Mode / Quality / Error) -->
    <div id="toast" class="absolute top-16 sm:top-20 right-1/2 translate-x-1/2 pointer-events-none opacity-0 transition-opacity duration-300 z-30 bg-neutral-900/95 border border-neutral-700 text-white text-xs sm:text-sm px-4 py-2 rounded-xl shadow-2xl flex items-center gap-2">
      <span id="toastIcon">📺</span>
      <span id="toastMsg">تم التبديل</span>
    </div>

    <!-- ================= CONTROLS OVERLAY ================= -->
    <div id="controlsOverlay" class="absolute inset-0 flex flex-col justify-between transition-opacity duration-300 z-20 pointer-events-auto bg-gradient-to-t from-black/90 via-transparent to-black/80 p-3 sm:p-5" style="padding-top: max(16px, var(--sat)); padding-bottom: max(16px, var(--sab)); padding-left: max(16px, var(--sal)); padding-right: max(16px, var(--sar));">
      
      <!-- Top Control Bar -->
      <div class="flex items-center justify-between w-full">
        
        <!-- Left: Channel Info & Live Status -->
        <div class="flex items-center gap-3">
          <div id="activeLogoContainer" class="w-10 h-10 sm:w-12 sm:h-12 rounded-xl bg-neutral-950 border border-neutral-800 p-1 flex items-center justify-center shrink-0 overflow-hidden shadow">
            <span id="activeLogoFallback" class="text-lg">📺</span>
            <img id="activeLogoImg" src="" class="w-full h-full object-contain hidden" alt="logo" onerror="this.classList.add('hidden'); document.getElementById('activeLogoFallback').classList.remove('hidden');">
          </div>
          <div class="flex flex-col">
            <div class="flex items-center gap-2">
              <h2 id="channelTitle" class="text-sm sm:text-base font-bold text-white tracking-wide truncate max-w-[180px] sm:max-w-xs">AlameeereTV</h2>
              <span id="liveBadge" class="hidden text-[10px] bg-red-600/90 text-white font-bold px-1.5 py-0.5 rounded tracking-wider uppercase animate-pulse">مباشر</span>
            </div>
            <div class="flex items-center gap-2 text-xs text-neutral-400">
              <span id="groupBadge" class="text-neutral-300">المجموعات</span>
              <span>•</span>
              <span id="qualityCurrentBadge" class="text-neutral-400 font-mono">--</span>
            </div>
          </div>
        </div>

        <!-- Right: Top Buttons (Groups Icon + Aspect Ratio) -->
        <div class="flex items-center gap-2 sm:gap-3">
          <!-- Groups & Channels Button (أيقونة المجموعات) -->
          <button 
            id="btnToggleGroups" 
            onclick="toggleGroupsDrawer()" 
            class="flex items-center gap-2 px-3 py-2 rounded-xl bg-neutral-900/90 hover:bg-neutral-800 border border-neutral-700/80 text-white transition active:scale-95 shadow-lg"
            title="المجموعات والقنوات"
          >
            <svg class="w-5 h-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"></path>
            </svg>
            <span class="text-xs sm:text-sm font-semibold">المجموعات</span>
          </button>

          <!-- Aspect Ratio Button (4 القياسات مع تجاوز حدود الكاميرا) -->
          <button 
            id="btnAspect" 
            onclick="cycleAspectMode()" 
            class="flex items-center gap-1.5 px-3 py-2 rounded-xl bg-neutral-900/90 hover:bg-neutral-800 border border-neutral-700/80 text-white transition active:scale-95 shadow-lg"
            title="أبعاد وقياسات الفيديو"
          >
            <svg class="w-5 h-5 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path>
            </svg>
            <span id="aspectModeText" class="text-xs sm:text-sm font-mono font-medium hidden sm:inline">احتواء</span>
          </button>
        </div>

      </div>

      <!-- Center Click Area to Toggle Controls -->
      <div class="flex-1 w-full" onclick="handleCenterTap()"></div>

      <!-- Bottom Control Bar -->
      <div class="flex items-center justify-between w-full pt-2">
        
        <!-- Left: Play/Pause & Mute -->
        <div class="flex items-center gap-2 sm:gap-4">
          <!-- Play / Pause -->
          <button id="btnPlay" onclick="togglePlay()" class="w-10 h-10 rounded-xl bg-white text-black flex items-center justify-center hover:bg-neutral-200 transition active:scale-95 shadow">
            <svg id="iconPlay" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg id="iconPause" class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>

            <svg id="iconVolume" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>
            </svg>
            <svg id="iconMuted" class="w-5 h-5 hidden text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">

        </div>

        <div class="flex items-center gap-2 sm:gap-3 relative">
          
          <!-- Quality Button (زر الجودات كأنه رابط يحمل جميع الجودات) -->
          <div class="relative">
            <button

              onclick="toggleQualityMenu(event)" 
              class="flex items-center gap-1.5 px-3 py-2 rounded-xl bg-neutral-900/90 hover:bg-neutral-800 border border-neutral-700/80 text-white transition active:scale-95 shadow-lg"

              <span id="activeQualityLabel" class="text-xs sm:text-sm font-bold text-amber-400 font-mono">--</span>
              <svg class="w-3.5 h-3.5 text-neutral-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">

              </svg>
            </button>

              <div id="qualityList" class="flex flex-col gap-1 max-h-52 overflow-y-auto">
                <!-- Injected dynamically -->
              </div>
            </div>
          </div>

            onclick="toggleFullscreen()"

        </div>

      </div>

        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-red-600 animate-ping"></span>
          <h3 class="font-bold text-base text-white">المجموعات والقنوات</h3>
        </div>
        <button onclick="toggleGroupsDrawer(false)" class="p-1.5 rounded-lg bg-neutral-900 text-neutral-400 hover:text-white border border-neutral-800">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>

      <!-- Side-by-side Dual Panels Container -->
      <div class="flex-1 flex overflow-hidden">
        
        <!-- Right Column: Groups List (المجموعات / الباقات) -->
        <div class="w-2/5 sm:w-1/2 border-l border-neutral-800/80 overflow-y-auto p-2 space-y-1 bg-neutral-950/50">
          <div class="text-[11px] font-bold text-neutral-400 px-2 py-1 uppercase tracking-wider">اختر الباقة</div>
          <div id="groupsList" class="space-y-1">
            <!-- Injected dynamically -->
          </div>
        </div>

        <!-- Left Column: Channels in selected Group (قائمة القنوات بجوارها مباشرة) -->
        <div class="w-3/5 sm:w-1/2 overflow-y-auto p-2 space-y-1 bg-black">
          <div class="flex items-center justify-between px-2 py-1 text-[11px] font-bold text-neutral-400 border-b border-neutral-900 mb-1">
            <span id="selectedGroupTitle">القنوات</span>
            <span id="selectedGroupCount" class="text-neutral-300 font-mono">0</span>
          </div>
          <div id="channelsList" class="space-y-1">
            <!-- Injected dynamically -->
          </div>
        </div>

      </div>

      <!-- Drawer Footer -->
      <div class="px-4 py-2 bg-neutral-950 border-t border-neutral-900 flex items-center justify-between text-[11px] text-neutral-400">
        <span>AlameeereTV Player</span>
        <span class="text-emerald-400 font-mono">تشغيل فوري على أقل جودة</span>
      </div>

    </div>

  </div>

        card.innerHTML = `
          <div class="flex items-center gap-2.5 overflow-hidden">
            <div class="w-8 h-8 rounded-lg bg-black border border-neutral-800 p-0.5 flex items-center justify-center shrink-0 overflow-hidden">
              ${ch.logo ? `<img src="${ch.logo}" class="w-full h-full object-contain" onerror="this.parentElement.innerHTML='📺'">` : '<span class="text-xs">📺</span>'}
            </div>
            <div class="flex flex-col overflow-hidden">
              <span class="text-xs font-bold text-white truncate max-w-[120px] sm:max-w-[160px]">${ch.name}</span>
              <span class="text-[10px] text-neutral-400 font-mono">${lowestQ.label} ${ch.qualities.length > 1 ? '← ' + highestQ.label : ''}</span>
            </div>
          </div>
          <div class="shrink-0">
            <span class="text-[9px] px-1.5 py-0.5 rounded font-mono ${
              isActive ? 'bg-red-600 text-white font-bold' : 'bg-neutral-800 text-neutral-300'
            }">${ch.qualities.length} جودات</span>
          </div>
        `;

        card.onclick = () => selectChannel(ch);
        channelsList.appendChild(card);
      });
    }

    // Auto Hiding Controls Overlay
    function resetControlsTimer() {
      controlsOverlay.style.opacity = '1';
      controlsOverlay.style.pointerEvents = 'auto';
      isControlsVisible = true;
      clearTimeout(controlsTimer);
      controlsTimer = setTimeout(() => {
        if (!video.paused && !groupsDrawer.classList.contains('translate-x-full') === false) {
          controlsOverlay.style.opacity = '0';
          controlsOverlay.style.pointerEvents = 'none';
          isControlsVisible = false;
          qualityMenu.classList.add('hidden');
        }
      }, 3500);
    }

    function handleCenterTap() {
      if (isControlsVisible) {
        controlsOverlay.style.opacity = '0';
        controlsOverlay.style.pointerEvents = 'none';
        isControlsVisible = false;
        qualityMenu.classList.add('hidden');
      } else {
        resetControlsTimer();
      }
    }

    // Close quality menu on outside click
    document.addEventListener('click', (e) => {
      if (!btnQuality.contains(e.target) && !qualityMenu.contains(e.target)) {
        qualityMenu.classList.add('hidden');
      }
    });

    // Reset controls timer on touch/mouse
    ['mousemove', 'touchstart', 'click'].forEach(evt => {
      document.getElementById('playerContainer').addEventListener(evt, resetControlsTimer, { passive: true });
    });

    // Init App
    window.addEventListener('DOMContentLoaded', () => {
      applyAspectMode();
      renderGroups();
      renderChannels(0);

      // Start with beIN Sports 1 if available
      const defaultChannel = CHANNELS_DB.find(c => c.name === 'beIN Sports 1') || CHANNELS_DB[0];
      if (defaultChannel) {
        selectChannel(defaultChannel);
      }
      resetControlsTimer();
    });
  </script>
</body>
</html>

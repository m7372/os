  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: #000000 !important;
      color: #ffffff;
      padding-top: var(--sat);
      padding-bottom: var(--sab);
      padding-left: var(--sal);
      padding-right: var(--sar);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #000000; }
    ::-webkit-scrollbar-thumb { background: #1c1c1c; border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: #2e2e2e; }

    video.mode-contain { object-fit: contain !important; aspect-ratio: auto !important; }
    video.mode-fill { object-fit: fill !important; aspect-ratio: auto !important; }
    video.mode-cover { object-fit: cover !important; aspect-ratio: auto !important; }
    video.mode-16-9 { object-fit: fill !important; aspect-ratio: 16/9 !important; }

    .brand-glow {
      background: linear-gradient(90deg, #ffffff 0%, #d4d4d8 50%, #ffffff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 16px rgba(255, 255, 255, 0.25);
    }
    .section-tab.active { background-color: #ffffff !important; color: #000000 !important; font-weight: 700; }
    .cat-btn.active { background-color: #ffffff !important; color: #000000 !important; font-weight: 700; border-color: #ffffff !important; }
    .channel-item.active { border-color: #e50914 !important; background: rgba(229, 9, 20, 0.12) !important; }
    
    /* تنسيق خانات الإدخال */
    .edit-input {
      background-color: #111;
      border: 1px solid #333;
      color: #fff;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 11px;
      width: 100%;
      outline: none;
      transition: border-color 0.2s;
    }
    .edit-input:focus { border-color: #e50914; }
  </style>
</head>

        });

        hls.on(Hls.Events.ERROR, (e, data) => {
          if (data.fatal) {
            statusBadge.textContent = 'خطأ اتصال';
            statusBadge.className = 'text-[10px] sm:text-xs bg-red-950/50 text-red-400 border border-red-800/50 px-2.5 py-1 rounded-full font-medium';
            noticeText.textContent = 'تعذر تشغيل سيرفر هذه القناة حالياً';
            notice.classList.remove('hidden');
            switch (data.type) {
              case Hls.ErrorTypes.NETWORK_ERROR: hls.startLoad(); break;
              case Hls.ErrorTypes.MEDIA_ERROR: hls.recoverMediaError(); break;
              default: hls.destroy(); break;
            }
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = playableUrl;
        video.addEventListener('loadedmetadata', () => {
          notice.classList.add('hidden');
          statusBadge.textContent = 'متصل';
          statusBadge.className = 'text-[10px] sm:text-xs bg-emerald-950/60 text-emerald-400 border border-emerald-800/60 px-2.5 py-1 rounded-full font-medium';
          video.play().catch(() => {});
        });
      }

      renderItems();
      updateNav();
    }

    // ===== التنقل بين الروابط =====
    function updateNav() {
      if (!currentPlaylist || currentPlaylist.length === 0) {
        counter.textContent = '0 / 0';
        btnPrev.disabled = true;
        btnNext.disabled = true;
        btnPrev.classList.add('opacity-40');
        btnNext.classList.add('opacity-40');
        return;
      }
      const idx = currentPlaylist.findIndex(c => activeChannel && c.id === activeChannel.id);
      if (idx === -1) {
        counter.textContent = '— / ' + currentPlaylist.length;
        btnPrev.disabled = true;
        btnNext.disabled = true;
        btnPrev.classList.add('opacity-40');
        btnNext.classList.add('opacity-40');
        return;
      }
      counter.textContent = (idx + 1) + ' / ' + currentPlaylist.length;
      btnPrev.disabled = idx <= 0;
      btnNext.disabled = idx >= currentPlaylist.length - 1;
      btnPrev.classList.toggle('opacity-40', idx <= 0);
      btnNext.classList.toggle('opacity-40', idx >= currentPlaylist.length - 1);
    }

    function gotoRelative(step) {
      if (!currentPlaylist || currentPlaylist.length === 0) return;
      let idx = currentPlaylist.findIndex(c => activeChannel && c.id === activeChannel.id);
      if (idx === -1) idx = 0;
      let next = idx + step;
      if (next < 0) next = 0;
      if (next >= currentPlaylist.length) next = currentPlaylist.length - 1;
      if (next === idx) return;
      playChannel(currentPlaylist[next]);
    }

    btnPrev.addEventListener('click', () => gotoRelative(-1));
    btnNext.addEventListener('click', () => gotoRelative(1));

    btnAspect.addEventListener('click', () => {
      aspectIndex = (aspectIndex + 1) % aspectModes.length;
      const current = aspectModes[aspectIndex];
      video.classList.remove('mode-contain', 'mode-fill', 'mode-cover', 'mode-16-9');
      video.classList.add(current.id);
      showToast(current.name);
    });

    function buildQualityMenu(levels) {
      qualityList.innerHTML = '';
      const autoBtn = document.createElement('button');
      autoBtn.className = 'px-2 py-1 rounded text-right hover:bg-neutral-800 text-white font-medium flex justify-between items-center transition';
      autoBtn.innerHTML = '<span>تلقائي (Auto)</span>' + (hls && hls.currentLevel === -1 ? '<span class="text-red-500 font-bold">✓</span>' : '');
      autoBtn.onclick = () => {
        if (hls) hls.currentLevel = -1;
        qualityMenu.classList.add('hidden');
        showToast('الجودة: تلقائي');
        if (activeChannel && activeChannel.custom_quality) {
          infoQuality.textContent = 'جودة: ' + activeChannel.custom_quality;
        }
      };
      qualityList.appendChild(autoBtn);
      if (!levels || levels.length === 0) return;
      levels.forEach((lvl, idx) => {
        const btn = document.createElement('button');
        btn.className = 'px-2 py-1 rounded text-right hover:bg-neutral-800 text-white font-medium flex justify-between items-center transition';
        const label = lvl.height ? `${lvl.height}p` : `${Math.round(lvl.bitrate / 1000)} kbps`;
        btn.innerHTML = `<span>${label}</span>` + (hls && hls.currentLevel === idx ? '<span class="text-red-500 font-bold">✓</span>' : '');
        btn.onclick = () => {
          if (hls) hls.currentLevel = idx;
          qualityMenu.classList.add('hidden');
          showToast(`الجودة: ${label}`);
          if (lvl.height) infoQuality.textContent = 'جودة: ' + lvl.height + 'p';
        };
        qualityList.appendChild(btn);
      });
    }

    btnQuality.addEventListener('click', (e) => {
      e.stopPropagation();
      qualityMenu.classList.toggle('hidden');
    });
    document.addEventListener('click', () => { qualityMenu.classList.add('hidden'); });

    function showToast(txt) {
      ratioToast.textContent = txt;
      ratioToast.style.opacity = '1';
      setTimeout(() => { ratioToast.style.opacity = '0'; }, 1500);
    }

    btnPlayPause.addEventListener('click', () => {
      if (video.paused) { video.play(); icoPlay.classList.add('hidden'); icoPause.classList.remove('hidden'); }
      else { video.pause(); icoPlay.classList.remove('hidden'); icoPause.classList.add('hidden'); }
    });
    video.addEventListener('play', () => { icoPlay.classList.add('hidden'); icoPause.classList.remove('hidden'); });
    video.addEventListener('pause', () => { icoPlay.classList.remove('hidden'); icoPause.classList.add('hidden'); });

    btnMute.addEventListener('click', () => {
      video.muted = !video.muted;
      if (video.muted) { icoVolOn.classList.add('hidden'); icoVolOff.classList.remove('hidden'); }
      else { icoVolOn.classList.remove('hidden'); icoVolOff.classList.add('hidden'); }
    });

    btnFullscreen.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        if (video.requestFullscreen) video.requestFullscreen();
        else if (video.webkitRequestFullscreen) video.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    });

    window.switchSection = function(section) {
      currentSection = section;
      document.querySelectorAll('.section-tab').forEach(t => t.classList.remove('active'));
      if (section === 'channels') document.getElementById('tabChannels').classList.add('active');
      if (section === 'movies') document.getElementById('tabMovies').classList.add('active');
      if (section === 'series') document.getElementById('tabSeries').classList.add('active');
      currentCategory = 'الكل';
      renderCategories();
      renderItems();
    };

    function renderCategories() {
      categoriesBar.innerHTML = '';
      let cats = ['الكل'];
      if (currentSection === 'channels') {
        EMBEDDED_CHANNELS.forEach(ch => {
          const c = ch.category || 'عام';
          if (!cats.includes(c)) cats.push(c);
        });
      } else if (currentSection === 'movies') {
        cats = ['الكل', 'أكشن', 'دراما', 'كوميدي', 'رعب', 'أفلام عربية', 'أفلام أجنبية'];
      } else if (currentSection === 'series') {
        cats = ['الكل', 'مسلسلات عربية', 'مسلسلات تركية', 'مسلسلات رمضان', 'دراما', 'إثارة'];
      }
      cats.forEach(c => {
        const btn = document.createElement('button');
        btn.className = `cat-btn shrink-0 text-xs px-3 py-1 rounded-full border border-neutral-800 bg-[#111] text-neutral-300 hover:bg-neutral-800 transition ${c === currentCategory ? 'active' : ''}`;
        btn.textContent = c;
        btn.onclick = () => { currentCategory = c; renderCategories(); renderItems(); };
        categoriesBar.appendChild(btn);
      });
    }

    // دالة حفظ الاسم
    window.saveName = function(id, num, val) {
      localStorage.setItem(`ch_name_${num}`, val);
      const ch = EMBEDDED_CHANNELS.find(c => c.id === id);
      if (ch) ch.name = val || `قناة ${num}`;
      if (activeChannel && activeChannel.id === id) {
        currentName.textContent = ch.name;
      }
    };

    // دالة حفظ الجودة
    window.saveQuality = function(id, num, val) {
      localStorage.setItem(`ch_quality_${num}`, val);
      const ch = EMBEDDED_CHANNELS.find(c => c.id === id);
      if (ch) ch.custom_quality = val;
      if (activeChannel && activeChannel.id === id) {
        infoQuality.textContent = 'جودة: ' + (val || '—');
      }
    };

    function renderItems() {
      const query = (searchInput.value || '').toLowerCase().trim();
      contentList.innerHTML = '';
      currentPlaylist = [];

      if (currentSection === 'channels') {
        contentCountLabel.innerHTML = 'القنوات المتاحة (<span id="count" class="text-white font-bold">0</span>)';
        const filtered = EMBEDDED_CHANNELS.filter(ch => {
          const matchCategory = currentCategory === 'الكل' || (ch.category || 'عام') === currentCategory;
          const matchQuery = !query || ch.name.toLowerCase().includes(query) || (ch.category && ch.category.toLowerCase().includes(query));
          return matchCategory && matchQuery;
        });
        currentPlaylist = filtered;
        document.getElementById('count').textContent = filtered.length;
        if (filtered.length === 0) {
          contentList.innerHTML = '<p class="text-neutral-500 text-center py-6 text-xs">لا توجد قنوات مطابقة للبحث</p>';
          updateNav();
          return;
        }
        filtered.forEach(ch => {
          const isVerified = Boolean(STREAM_MAP[ch.id]) || ch.stream_url;
          const isActive = activeChannel && activeChannel.id === ch.id;
          const item = document.createElement('div');
          item.className = `channel-item border border-neutral-900 bg-[#0d0d0d] hover:bg-[#151515] p-2 rounded-xl cursor-pointer flex items-center justify-between gap-3 transition group ${isActive ? 'active' : ''}`;
          
          // إذا كانت القناة من القنوات المضافة حديثاً (لديها custom_num)
          if (ch.custom_num) {
            item.innerHTML = `
              <div class="flex flex-col gap-1 w-full">
                <div class="flex items-center justify-between gap-2 w-full">
                  <div class="flex items-center gap-2">
                    <span class="text-xs font-bold text-red-400 bg-red-950/40 border border-red-900/60 px-2 py-0.5 rounded">${ch.custom_num}</span>
                    <div class="flex gap-1">
                      <input type="text" class="edit-input w-24 sm:w-32" placeholder="اسم القناة" value="${ch.name !== `قناة ${ch.custom_num}` ? ch.name : ''}" onchange="saveName(${ch.id}, ${ch.custom_num}, this.value)">
                      <input type="text" class="edit-input w-16 sm:w-20" placeholder="الجودة" value="${ch.custom_quality}" onchange="saveQuality(${ch.id}, ${ch.custom_num}, this.value)">
                    </div>
                  </div>
                  <button class="text-[10px] bg-emerald-600 hover:bg-emerald-700 text-white px-2 py-1 rounded" onclick="playChannel(EMBEDDED_CHANNELS.find(c => c.id === ${ch.id}))">تشغيل</button>
                </div>
              </div>
            `;
          } else {
            // القنوات القديمة
            item.innerHTML = `
              <div class="flex items-center gap-2.5 truncate">
                <div class="w-9 h-9 rounded-lg bg-black border border-neutral-800 flex items-center justify-center overflow-hidden shrink-0 text-sm">
                  ${ch.logo ? `<img src="${ch.logo}" class="w-full h-full object-contain" onerror="this.parentElement.textContent='📺'">` : '📺'}
                </div>
                <div class="truncate">
                  <p class="text-xs sm:text-sm font-semibold text-white group-hover:text-red-400 transition truncate">${ch.name}</p>
                  <p class="text-[11px] text-neutral-400 truncate">${ch.category || 'عام'} ${ch.country ? '• ' + ch.country : ''}</p>
                </div>
              </div>
              <div class="flex items-center gap-1.5 shrink-0">
                ${isVerified ? '<span class="text-[10px] text-emerald-400 bg-emerald-950/60 border border-emerald-800/40 px-2 py-0.5 rounded-full">شغال</span>' : ''}
                ${isActive ? '<span class="w-2 h-2 rounded-full bg-red-500 animate-ping"></span>' : ''}
              </div>
            `;
            item.onclick = (e) => {
              if (e.target.tagName !== 'INPUT') playChannel(ch);
            };
          }
          
          contentList.appendChild(item);
        });

      } else if (currentSection === 'movies') {
        contentCountLabel.innerHTML = 'قنوات وسينما الأفلام (<span id="count" class="text-white font-bold">0</span>)';
        const movieChannels = EMBEDDED_CHANNELS.filter(c => (c.category === 'أفلام' || c.name.toLowerCase().includes('movie') || c.name.includes('سينما') || c.name.includes('أفلام')));
        currentPlaylist = movieChannels;
        document.getElementById('count').textContent = movieChannels.length;
        movieChannels.forEach(ch => {
          const isVerified = Boolean(STREAM_MAP[ch.id]) || ch.stream_url;
          const isActive = activeChannel && activeChannel.id === ch.id;
          const item = document.createElement('div');
          item.className = `channel-item border border-neutral-900 bg-[#0d0d0d] hover:bg-[#151515] p-2 rounded-xl cursor-pointer flex items-center justify-between gap-3 transition group ${isActive ? 'active' : ''}`;
          item.innerHTML = `
            <div class="flex items-center gap-2.5 truncate">
              <div class="w-9 h-9 rounded-lg bg-black border border-neutral-800 flex items-center justify-center overflow-hidden shrink-0 text-sm">
                ${ch.logo ? `<img src="${ch.logo}" class="w-full h-full object-contain" onerror="this.parentElement.textContent='🎬'">` : '🎬'}
              </div>
              <div class="truncate">
                <p class="text-xs sm:text-sm font-semibold text-white group-hover:text-red-400 transition truncate">${ch.name}</p>
                <p class="text-[11px] text-neutral-400 truncate">أفلام ومسلسلات على مدار الساعة</p>
              </div>
            </div>
            <div class="flex items-center gap-1.5 shrink-0">
              ${isVerified ? '<span class="text-[10px] text-emerald-400 bg-emerald-950/60 border border-emerald-800/40 px-2 py-0.5 rounded-full">شغال</span>' : ''}
            </div>
          `;
          item.onclick = () => playChannel(ch);
          contentList.appendChild(item);
        });

      } else if (currentSection === 'series') {
        contentCountLabel.innerHTML = 'قنوات المسلسلات والدراما (<span id="count" class="text-white font-bold">0</span>)';
        const seriesChannels = EMBEDDED_CHANNELS.filter(c => (c.category === 'مسلسلات' || c.category === 'دراما' || c.name.includes('دراما') || c.name.includes('Drama') || c.name.includes('الحارة')));
        currentPlaylist = seriesChannels;
        document.getElementById('count').textContent = seriesChannels.length;
        seriesChannels.forEach(ch => {
          const isVerified = Boolean(STREAM_MAP[ch.id]) || ch.stream_url;
          const isActive = activeChannel && activeChannel.id === ch.id;
          const item = document.createElement('div');
          item.className = `channel-item border border-neutral-900 bg-[#0d0d0d] hover:bg-[#151515] p-2 rounded-xl cursor-pointer flex items-center justify-between gap-3 transition group ${isActive ? 'active' : ''}`;
          item.innerHTML = `
            <div class="flex items-center gap-2.5 truncate">
              <div class="w-9 h-9 rounded-lg bg-black border border-neutral-800 flex items-center justify-center overflow-hidden shrink-0 text-sm">
                ${ch.logo ? `<img src="${ch.logo}" class="w-full h-full object-contain" onerror="this.parentElement.textContent='🍿'">` : '🍿'}
              </div>
              <div class="truncate">
                <p class="text-xs sm:text-sm font-semibold text-white group-hover:text-red-400 transition truncate">${ch.name}</p>
                <p class="text-[11px] text-neutral-400 truncate">بث المسلسلات والدراما المتواصلة</p>
              </div>
            </div>
            <div class="flex items-center gap-1.5 shrink-0">
              ${isVerified ? '<span class="text-[10px] text-emerald-400 bg-emerald-950/60 border border-emerald-800/40 px-2 py-0.5 rounded-full">شغال</span>' : ''}
            </div>
          `;
          item.onclick = () => playChannel(ch);
          contentList.appendChild(item);
        });
      }
      updateNav();
    }

    searchInput.addEventListener('input', () => { renderItems(); });

    renderCategories();
    renderItems();

    const first = EMBEDDED_CHANNELS.find(c => STREAM_MAP[c.id]);
    if (first && window.innerWidth >= 1024) {
      playChannel(first);
    }
  </script>
</body>
</html>

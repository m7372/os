<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Oscar TV Live | بث القنوات المباشر</title>
  <!-- HLS.js for Live Streaming -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Cairo', sans-serif; box-sizing: border-box; }
    body { background-color: #0b0f19; color: #f3f4f6; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #111827; }
    ::-webkit-scrollbar-thumb { background: #374151; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #4b5563; }
    .video-container { position: relative; width: 100%; max-width: 900px; margin: 0 auto; background: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.7); }
    .video-aspect { position: relative; padding-top: 56.25%; /* 16:9 */ }
    .video-aspect video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex flex-col">

  <!-- STICKY TOP PLAYER SECTION (المشغل مثبت في الأعلى) -->
  <header class="sticky top-0 z-50 bg-slate-900/95 backdrop-blur-md border-b border-slate-800 shadow-2xl transition-all">
    <div class="max-w-5xl mx-auto px-2 sm:px-4 py-2">
      
      <!-- Video Container -->
      <div class="video-container border border-slate-800 bg-black">
        <div class="video-aspect">
          <video id="videoPlayer" controls playsinline preload="auto"></video>
          
          <!-- Loading Overlay -->
          <div id="playerLoader" class="absolute inset-0 flex flex-col items-center justify-center bg-black/80 z-10 hidden">
            <div class="w-10 h-10 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin mb-2"></div>
            <span class="text-xs sm:text-sm text-slate-300 font-semibold" id="loaderText">جاري تحميل البث...</span>
          </div>

          <!-- Error Overlay -->
          <div id="playerError" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-950/90 z-20 hidden p-4 text-center">
            <div class="w-12 h-12 rounded-full bg-rose-500/20 text-rose-400 flex items-center justify-center text-xl mb-2">⚠️</div>
            <p class="text-sm text-rose-300 font-bold mb-2" id="errorMsg">تعذر تشغيل هذا الرابط حالياً</p>
            <button onclick="retryCurrentStream()" class="px-4 py-1.5 bg-rose-600 hover:bg-rose-500 text-white rounded-lg text-xs font-semibold shadow-md transition">إعادة المحاولة</button>
          </div>
        </div>

        <!-- PLAYER CONTROLS / INFO BAR -->
        <div class="p-2 sm:p-3 bg-slate-900 flex flex-wrap items-center justify-between gap-2 border-t border-slate-800 text-xs sm:text-sm">
          
          <!-- Channel Name & Live Badge -->
          <div class="flex items-center gap-2 min-w-0">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
            <div class="truncate font-bold text-white text-sm sm:text-base" id="currentChannelName">اختر قناة لبدء البث</div>
          </div>

          <!-- QUALITIES SELECTOR (داخل المشغل) -->
          <div class="flex items-center gap-1.5" id="qualityContainer">
            <span class="text-slate-400 text-xs font-medium ml-1">الجودة:</span>
            <div id="qualityButtons" class="flex items-center gap-1 bg-slate-800/80 p-0.5 rounded-lg border border-slate-700">
              <!-- Buttons dynamically inserted here -->
              <span class="text-slate-400 text-xs px-2 py-0.5">تلقائي</span>
            </div>
          </div>

        </div>
      </div>

    </div>
  </header>

  <!-- MAIN CHANNELS CONTENT -->
  <main class="max-w-5xl mx-auto px-3 sm:px-4 py-4 flex-1 w-full">

    <!-- SEARCH & FILTER BAR -->
    <div class="flex flex-col sm:flex-row gap-2.5 mb-4">
      
      <!-- Search Input -->
      <div class="relative flex-1">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="ابحث عن اسم القناة (مثل: beIN, ثمانية, MBC, الكأس, زي ألوان)..." 
          class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-xs sm:text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition shadow-inner"
        />
        <span class="absolute left-3 top-2.5 text-slate-500">🔍</span>
      </div>

      <!-- Quick Stats -->
      <div class="flex items-center justify-between sm:justify-end gap-2 text-xs text-slate-400 bg-slate-900 border border-slate-800 px-3 py-2 rounded-xl">
        <span>القنوات المتوفرة:</span>
        <span id="channelCountBadge" class="font-bold text-emerald-400 bg-slate-800 px-2 py-0.5 rounded-md">0</span>
      </div>
    </div>

    <!-- CATEGORIES TABS -->
    <div class="flex items-center gap-1.5 overflow-x-auto pb-2 mb-4 scrollbar-none text-xs sm:text-sm" id="categoryTabs">
      <button onclick="filterCategory('all')" data-cat="all" class="cat-btn px-3.5 py-1.5 rounded-lg font-bold bg-emerald-600 text-white shadow-md whitespace-nowrap transition">الكل</button>
      <button onclick="filterCategory('رياضة')" data-cat="رياضة" class="cat-btn px-3.5 py-1.5 rounded-lg font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 whitespace-nowrap transition">رياضة ⚽</button>
      <button onclick="filterCategory('مسلسلات')" data-cat="مسلسلات" class="cat-btn px-3.5 py-1.5 rounded-lg font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 whitespace-nowrap transition">مسلسلات 🎬</button>
      <button onclick="filterCategory('أفلام')" data-cat="أفلام" class="cat-btn px-3.5 py-1.5 rounded-lg font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 whitespace-nowrap transition">أفلام 🍿</button>
      <button onclick="filterCategory('أطفال')" data-cat="أطفال" class="cat-btn px-3.5 py-1.5 rounded-lg font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 whitespace-nowrap transition">أطفال 👶</button>
      <button onclick="filterCategory('عام')" data-cat="عام" class="cat-btn px-3.5 py-1.5 rounded-lg font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 whitespace-nowrap transition">عام 📺</button>
    </div>

      <!-- Channels will be injected here -->
    </div>

  </main>

    let currentHls = null;
    let selectedChannel = null;
    let selectedQualityIndex = 0;
    let activeCategory = 'all';

    const video = document.getElementById('videoPlayer');
    const loader = document.getElementById('playerLoader');
    const errorBox = document.getElementById('playerError');
    const channelNameEl = document.getElementById('currentChannelName');
    const qualityButtonsEl = document.getElementById('qualityButtons');
    const channelsGrid = document.getElementById('channelsGrid');
    const searchInput = document.getElementById('searchInput');
    const countBadge = document.getElementById('channelCountBadge');

    function getStreamUrl(streamId) {
      return WORKER_BASE + streamId + '.css';
    }

    function playChannel(channel, qualityIdx = 0) {
      selectedChannel = channel;
      // Default to lowest quality (index 0)
      selectedQualityIndex = Math.min(qualityIdx, channel.qualities.length - 1);
      const quality = channel.qualities[selectedQualityIndex];

      channelNameEl.innerText = channel.name + (quality.label ? ' (' + quality.label + ')' : '');

      renderQualityButtons(channel, selectedQualityIndex);

      const streamUrl = getStreamUrl(quality.stream_id);
      loadStream(streamUrl);

      highlightActiveCard(channel.key);

      if (window.scrollY > 400) {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function loadStream(url) {
      showLoader(true);
      showError(false);

      if (currentHls) {
        currentHls.destroy();
        currentHls = null;
      }

      if (Hls.isSupported()) {
        currentHls = new Hls({
          enableWorker: true,
          lowLatencyMode: true,
          backBufferLength: 30,
          manifestLoadingTimeOut: 15000,
          manifestLoadingMaxRetry: 4,
          levelLoadingTimeOut: 15000,
        });

        currentHls.loadSource(url);
        currentHls.attachMedia(video);

        currentHls.on(Hls.Events.MANIFEST_PARSED, function () {
          showLoader(false);
          video.play().catch(function(e) { console.log('Autoplay policy: click play', e); });
        });

        currentHls.on(Hls.Events.ERROR, function (event, data) {
          if (data.fatal) {
            console.warn('HLS Fatal Error:', data.type);
            switch (data.type) {
              case Hls.ErrorTypes.NETWORK_ERROR:
                currentHls.startLoad();
                break;
              case Hls.ErrorTypes.MEDIA_ERROR:
                currentHls.recoverMediaError();
                break;
              default:
                showLoader(false);
                showError(true, 'تعذر تحميل هذا البث، جرب جودة أخرى أو قناة بديلة.');
                break;
            }
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.addEventListener('loadedmetadata', function () {
          showLoader(false);
          video.play().catch(function(e) { console.log(e); });
        });
        video.addEventListener('error', function () {
          showLoader(false);
          showError(true);
        });
      } else {
        showLoader(false);
        showError(true, 'المتصفح لا يدعم تشغيل HLS');
      }
    }

    function retryCurrentStream() {
      if (selectedChannel) {
        playChannel(selectedChannel, selectedQualityIndex);
      }
    }

    function showLoader(visible, text = 'جاري الاتصال بالبث...') {
      loader.classList.toggle('hidden', !visible);
      document.getElementById('loaderText').innerText = text;
    }

    function showError(visible, msg = 'تعذر تشغيل الرابط حالياً') {
      errorBox.classList.toggle('hidden', !visible);
      document.getElementById('errorMsg').innerText = msg;
    }

    function renderQualityButtons(channel, activeIdx) {
      qualityButtonsEl.innerHTML = '';
      if (!channel.qualities || channel.qualities.length <= 1) {
        qualityButtonsEl.innerHTML = '<span class="text-xs text-slate-400 px-2 py-0.5">عادي</span>';
        return;
      }

      channel.qualities.forEach(function(q, idx) {
        const btn = document.createElement('button');
        const isActive = (idx === activeIdx);
        btn.className = 'px-2.5 py-1 rounded-md text-xs font-bold transition ' + (
          isActive 
            ? 'bg-emerald-600 text-white shadow-sm' 
            : 'text-slate-300 hover:bg-slate-700/60'
        );
        btn.innerText = q.label;
        btn.onclick = function() {
          playChannel(channel, idx);
        };
        qualityButtonsEl.appendChild(btn);
      });
    }

    function highlightActiveCard(key) {
      document.querySelectorAll('.channel-card').forEach(function(el) {
        if (el.dataset.key === key) {
          el.classList.add('border-emerald-500', 'bg-slate-800');
          el.classList.remove('border-slate-800', 'bg-slate-900');
        } else {
          el.classList.remove('border-emerald-500', 'bg-slate-800');
          el.classList.add('border-slate-800', 'bg-slate-900');
        }
      });
    }

    function renderChannels() {
      const q = searchInput.value.trim().toLowerCase();
      channelsGrid.innerHTML = '';

      let count = 0;
      CHANNELS_DATA.forEach(function(channel) {
        const matchCat = (activeCategory === 'all' || channel.category === activeCategory);
        const matchSearch = (!q || channel.name.toLowerCase().includes(q) || channel.category.toLowerCase().includes(q));

        if (matchCat && matchSearch) {
          count++;
          const card = document.createElement('div');
          const isCurrent = (selectedChannel && selectedChannel.key === channel.key);
          card.dataset.key = channel.key;
          card.className = 'channel-card cursor-pointer group flex flex-col items-center justify-between p-2.5 sm:p-3 rounded-xl border transition-all duration-200 hover:scale-[1.02] hover:border-slate-700 hover:shadow-lg ' + (
            isCurrent ? 'border-emerald-500 bg-slate-800' : 'border-slate-800 bg-slate-900/90'
          );

          let logoHtml = '';
          if (channel.logo && channel.logo.startsWith('http')) {
            logoHtml = '<img src="' + channel.logo + '" alt="' + channel.name + '" class="w-12 h-12 sm:w-14 sm:h-14 object-contain mb-2 rounded-lg p-1 bg-slate-950/50" onerror="this.outerHTML=\'<div class="w-12 h-12 sm:w-14 sm:h-14 rounded-lg bg-slate-800 flex items-center justify-center text-xl sm:text-2xl mb-2 text-slate-400 font-bold">📺</div>\'\">';
          } else {
            logoHtml = '<div class="w-12 h-12 sm:w-14 sm:h-14 rounded-lg bg-slate-800 flex items-center justify-center text-xl sm:text-2xl mb-2 text-slate-400 font-bold group-hover:bg-slate-700 transition">📺</div>';
          }

          const qualCount = channel.qualities.length;
          const qualBadge = qualCount > 1 
            ? '<span class="text-[10px] text-emerald-400 bg-emerald-950/60 border border-emerald-800/40 px-1.5 py-0.5 rounded">' + qualCount + ' جودات</span>' 
            : '<span class="text-[10px] text-slate-500 bg-slate-950/40 px-1.5 py-0.5 rounded">' + channel.category + '</span>';

          card.innerHTML = logoHtml +
            '<div class="text-center w-full min-w-0">' +
              '<div class="font-bold text-xs sm:text-sm text-slate-200 truncate group-hover:text-emerald-400 transition">' + channel.name + '</div>' +
              '<div class="mt-1 flex items-center justify-center gap-1">' +
                qualBadge +
              '</div>' +
            '</div>';

          card.onclick = function() {
            // Always starts at lowest quality (index 0)
            playChannel(channel, 0);
          };

          channelsGrid.appendChild(card);
        }
      });

      countBadge.innerText = count;
    }

    function filterCategory(cat) {
      activeCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(function(btn) {
        if (btn.dataset.cat === cat) {
          btn.className = 'cat-btn px-3.5 py-1.5 rounded-lg font-bold bg-emerald-600 text-white shadow-md whitespace-nowrap transition';
        } else {
          btn.className = 'cat-btn px-3.5 py-1.5 rounded-lg font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 whitespace-nowrap transition';
        }
      });
      renderChannels();
    }

    searchInput.addEventListener('input', function() {
      renderChannels();
    });

    window.addEventListener('DOMContentLoaded', function() {
      renderChannels();
      if (CHANNELS_DATA.length > 0) {
        // Auto-play first channel at lowest quality (0)
        playChannel(CHANNELS_DATA[0], 0);
      }
    });
  </script>

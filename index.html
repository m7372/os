<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlameeereTv - البث المباشر</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

  <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-20 flex flex-wrap justify-between items-center gap-4">
    <div class="flex items-center gap-3">
      <span class="w-3 h-3 bg-red-500 rounded-full animate-ping"></span>
      <h1 class="text-xl font-bold text-white">AlameeereTv - البث المباشر</h1>
    </div>
    <input id="searchInput" type="text" placeholder="ابحث عن قناة (مثال: beIN, MBC)..." 
           class="bg-slate-800 border border-slate-700 text-sm rounded-lg px-4 py-2 w-72 focus:outline-none focus:border-red-500 transition text-white placeholder-slate-400">
  </header>

  <main class="flex-1 grid grid-cols-1 lg:grid-cols-3 gap-6 p-4 max-w-7xl mx-auto w-full">
    
    <section class="lg:col-span-2 flex flex-col gap-3">
      <div class="relative bg-black rounded-2xl overflow-hidden aspect-video border border-slate-800 shadow-2xl flex items-center justify-center">
        <video id="videoPlayer" controls autoplay playsinline class="w-full h-full object-contain"></video>
        <div id="notice" class="absolute inset-0 flex items-center justify-center bg-slate-900/90 text-slate-300 text-sm p-4 text-center">
          اختر قناة لبدء البث
        </div>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-wrap justify-between items-center gap-3">
        <div>
          <h2 id="currentName" class="text-lg font-bold text-white">لم يتم تحديد قناة</h2>
          <p id="currentCat" class="text-xs text-slate-400">بث مباشر بدون تقطيع</p>
        </div>
        <div id="qualityControls" class="flex items-center gap-2"></div>
      </div>
    </section>

    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col gap-3 max-h-[82vh]">
      <div class="flex justify-between items-center pb-2 border-b border-slate-800">
        <h3 class="font-bold text-sm text-slate-300">القنوات المتاحة (<span id="count">0</span>)</h3>
        <span class="text-xs text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20">سيرفرات مؤكدة</span>
      </div>
      <div id="channelsList" class="flex-1 overflow-y-auto space-y-2 pr-1"></div>
    </section>
  </main>

  <script>
    const WORKER_URL = 'https://os.m737217130.workers.dev/';
    const STREAM_BASE = 'http://newlb.getourxufiles.shop:8080/assets/CsrsaFYFKo4MuziKdPkb1BElYSLJUI3XQ6tfXlnT107b0x2Ei6/myvs8QGJp1i2Uju0lgp8zwhBgV70LX6U5bjpYiiaSDyQEd1lTR/';

    const CHANNELS = [
      { id: 'bein1', name: 'beIN Sports 1', category: 'رياضة', logo: 'https://nextdaywithme.shop/uploads/channels/a097c34e337a8c9294d62cdfc17bb577.webp', streams: { 'FHD': 1319, 'HD': 1316, 'SD': 1313 } },
      { id: 'bein2', name: 'beIN Sports 2', category: 'رياضة', logo: 'https://nextdaywithme.shop/uploads/channels/06dc8a8bae7d49bc3033271575498a7e.webp', streams: { 'FHD': 1328, 'HD': 1325, 'SD': 1322 } },
      { id: 'bein3', name: 'beIN Sports 3', category: 'رياضة', logo: 'https://nextdaywithme.shop/uploads/channels/305e84a2db716775c64388f60741decb.webp', streams: { 'FHD': 1337, 'HD': 1334, 'SD': 1331 } },
      { id: 'bein4', name: 'beIN Sports 4', category: 'رياضة', logo: 'https://nextdaywithme.shop/uploads/channels/449d45498946dd728453b1a4041b67c7.webp', streams: { 'FHD': 1346, 'HD': 1343, 'SD': 1340 } },
      { id: 'bein5', name: 'beIN Sports 5', category: 'رياضة', logo: 'https://nextdaywithme.shop/uploads/channels/7f1ec6d635bc895634c24c181120e80d.webp', streams: { 'FHD': 1355, 'SD': 1349 } },
      { id: 'bein6', name: 'beIN Sports 6', category: 'رياضة', logo: 'https://nextdaywithme.shop/uploads/channels/ff919dc1e73746e934dfd9f078d7e59d.webp', streams: { 'FHD': 1364, 'HD': 1361, 'SD': 1358 } },
      { id: 'bein7', name: 'beIN Sports 7', category: 'رياضة', logo: 'https://nextdaywithme.shop/uploads/channels/fcec8d4f6e2e146452bb1f3b8e0aec67.webp', streams: { 'FHD': 1373, 'HD': 1370, 'SD': 1367 } },
      { id: 'bein8', name: 'beIN Sports 8', category: 'رياضة', logo: 'https://nextdaywithme.shop/uploads/channels/5bc41cfd7a99da0bbec15f9c6c12a4b5.webp', streams: { 'FHD': 1382, 'HD': 1379, 'SD': 1376 } },
      { id: 'bein9', name: 'beIN Sports 9', category: 'رياضة', logo: 'https://nextdaywithme.shop/uploads/channels/4d06ba05a00291f30f21ad8ad4ab4e1c.webp', streams: { 'FHD': 1391, 'HD': 1388, 'SD': 1385 } },
      { id: 'mbc', name: 'MBC', category: 'عام', logo: 'https://nextdaywithme.shop/uploads/channels/3d6d0cc67d579516c868ce3caad7cb5a.webp', streams: { 'HD': 20, 'FHD': 29 } },
      { id: 'dmc', name: 'dmc', category: 'عام', logo: '', streams: { 'HD': 44 } },
      { id: 'dmc_drama', name: 'dmc دراما', category: 'دراما', logo: '', streams: { 'SD': 47 } },
      { id: 'sama', name: 'قناة سما', category: 'عام', logo: '', streams: { 'SD': 71 } },
      { id: 'sada_balad', name: 'صدى البلد', category: 'عام', logo: '', streams: { 'FHD': 74 } },
      { id: 'rotana_drama', name: 'روتانا دراما', category: 'دراما', logo: '', streams: { 'FHD': 80 } }
    ];

    let currentChannel = null;
    let currentQuality = 'FHD';
    let hls = null;
    const video = document.getElementById('videoPlayer');
    const notice = document.getElementById('notice');
    const currentName = document.getElementById('currentName');
    const currentCat = document.getElementById('currentCat');
    const qualityControls = document.getElementById('qualityControls');
    const channelsList = document.getElementById('channelsList');
    const count = document.getElementById('count');
    const searchInput = document.getElementById('searchInput');

    function playStream(streamId, ch) {
      notice.textContent = 'جاري الاتصال بالبث...';
      notice.classList.remove('hidden');

      const rawUrl = `${STREAM_BASE}${streamId}.css`;
      const playableUrl = `${WORKER_URL}?url=${encodeURIComponent(rawUrl)}`;

      if (hls) hls.destroy();

      if (Hls.isSupported()) {
        hls = new Hls({ enableWorker: true, lowLatencyMode: true });
        hls.loadSource(playableUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          notice.classList.add('hidden');
          video.play().catch(() => {});
        });
        hls.on(Hls.Events.ERROR, () => {
          notice.textContent = 'تعذر تشغيل هذه الجودة حالياً، جرب جودة أخرى';
          notice.classList.remove('hidden');
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = playableUrl;
        notice.classList.add('hidden');
        video.play().catch(() => {});
      }
    }

    function selectChannel(ch, quality = null) {
      currentChannel = ch;
      currentName.textContent = ch.name;
      currentCat.textContent = ch.category;

      const availableQualities = Object.keys(ch.streams);
      currentQuality = (quality && ch.streams[quality]) ? quality : availableQualities[0];

      qualityControls.innerHTML = '';
      availableQualities.forEach(q => {
        const btn = document.createElement('button');
        btn.textContent = q;
        btn.className = `px-2.5 py-1 text-xs rounded-lg font-bold transition border ${q === currentQuality ? 'bg-red-500 text-white border-red-500' : 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700'}`;
        btn.onclick = () => selectChannel(ch, q);
        qualityControls.appendChild(btn);
      });

      playStream(ch.streams[currentQuality], ch);
    }

    function render(list) {
      channelsList.innerHTML = '';
      count.textContent = list.length;
      list.forEach(ch => {
        const item = document.createElement('div');
        item.className = "border border-slate-800 bg-slate-800/40 hover:bg-slate-800 p-2.5 rounded-xl cursor-pointer flex items-center justify-between gap-3 transition group";
        item.innerHTML = `
          <div class="flex items-center gap-3 truncate">
            <div class="w-10 h-10 rounded-lg bg-slate-900 border border-slate-700 flex items-center justify-center overflow-hidden shrink-0">
              ${ch.logo ? `<img src="${ch.logo}" class="w-full h-full object-contain" onerror="this.style.display='none'">` : '📺'}
            </div>
            <div class="truncate">
              <p class="text-sm font-semibold text-white group-hover:text-red-400 transition truncate">${ch.name}</p>
              <p class="text-xs text-slate-400 truncate">${ch.category}</p>
            </div>
          </div>
          <span class="text-[10px] text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-2 py-0.5 rounded-full shrink-0">شغال</span>
        `;
        item.onclick = () => selectChannel(ch);
        channelsList.appendChild(item);
      });
    }

    searchInput.addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      render(CHANNELS.filter(c => c.name.toLowerCase().includes(q) || c.category.toLowerCase().includes(q)));
    });

    render(CHANNELS);
    selectChannel(CHANNELS[0]);
  </script>
</body>
</html>

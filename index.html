<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بث القنوات المباشر - AlameeereTv</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-20 flex flex-wrap justify-between items-center gap-4">
    <div class="flex items-center gap-3">
      <span class="w-3 h-3 bg-red-500 rounded-full animate-ping"></span>
      <h1 class="text-xl font-bold text-white">Oscar TV - بث مباشر</h1>
    </div>
    <input id="searchInput" type="text" placeholder="ابحث عن قناة..." 
           class="bg-slate-800 border border-slate-700 text-sm rounded-lg px-4 py-2 w-64 focus:outline-none focus:border-blue-500 transition">
  </header>

  <!-- Content -->
  <main class="flex-1 grid grid-cols-1 lg:grid-cols-3 gap-6 p-4 max-w-7xl mx-auto w-full">
    
    <!-- Player -->
    <section class="lg:col-span-2 flex flex-col gap-3">
      <div class="relative bg-black rounded-2xl overflow-hidden aspect-video border border-slate-800 shadow-2xl flex items-center justify-center">
        <video id="videoPlayer" controls autoplay playsinline class="w-full h-full object-contain"></video>
        <div id="notice" class="absolute inset-0 flex items-center justify-center bg-slate-900/90 text-slate-400 text-sm p-4 text-center">
          اختر قناة من القائمة لبدء المشاهدة
        </div>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex justify-between items-center">
        <div>
          <h2 id="currentName" class="text-lg font-bold text-white">لم يتم تحديد قناة</h2>
          <p id="currentCat" class="text-xs text-slate-400">بث مباشر عالي الدقة</p>
        </div>
        <span class="text-xs bg-red-500/20 text-red-400 border border-red-500/30 px-3 py-1 rounded-full font-bold">LIVE</span>
      </div>
    </section>

    <!-- Channels List -->
    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col gap-3 max-h-[82vh]">
      <div class="flex justify-between items-center pb-2 border-b border-slate-800">
        <h3 class="font-bold text-sm text-slate-300">القنوات المتاحة (<span id="count">0</span>)</h3>
      </div>
      <div id="channelsList" class="flex-1 overflow-y-auto space-y-2 pr-1">
        <p class="text-slate-500 text-center py-8 text-sm">جاري تحميل القنوات...</p>
      </div>
    </section>

  </main>

  <script>
    const PROXY = 'https://os.m737217130.workers.dev/?url=';
    const BEIN_1_STREAM = 'http://newlb.getourxufiles.shop:8080/assets/CsrsaFYFKo4MuziKdPkb1BElYSLJUI3XQ6tfXlnT107b0x2Ei6/myvs8QGJp1i2Uju0lgp8zwhBgV70LX6U5bjpYiiaSDyQEd1lTR/1313.css';

    const video = document.getElementById('videoPlayer');
    const notice = document.getElementById('notice');
    const currentName = document.getElementById('currentName');
    const currentCat = document.getElementById('currentCat');
    const channelsList = document.getElementById('channelsList');
    const searchInput = document.getElementById('searchInput');
    const count = document.getElementById('count');
    let hls = null;
    let allChannels = [];

    function playStream(rawUrl, channelName, channelCat) {
      currentName.textContent = channelName;
      currentCat.textContent = channelCat || "بث مباشر";
      notice.classList.add('hidden');

      const playableUrl = PROXY + encodeURIComponent(rawUrl);

      if (hls) {
        hls.destroy();
      }

      if (Hls.isSupported()) {
        hls = new Hls({
          enableWorker: true,
          lowLatencyMode: true
        });
        hls.loadSource(playableUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play().catch(() => {});
        });
        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            switch (data.type) {
              case Hls.ErrorTypes.NETWORK_ERROR:
                hls.startLoad();
                break;
              case Hls.ErrorTypes.MEDIA_ERROR:
                hls.recoverMediaError();
                break;
              default:
                hls.destroy();
                break;
            }
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = playableUrl;
        video.play().catch(() => {});
      }
    }

    function playChannel(ch) {
      // إذا كانت القناة beIN 1 أو لديها رابط محدد
      if (ch.id === 63 || ch.name.includes('beIN Sports 1')) {
        playStream(BEIN_1_STREAM, ch.name, ch.category);
      } else if (ch.stream_url) {
        playStream(ch.stream_url, ch.name, ch.category);
      } else {
        currentName.textContent = ch.name;
        currentCat.textContent = ch.category;
        notice.textContent = `القناة: ${ch.name} (قيد جلب السيرفر الخاص بها)`;
        notice.classList.remove('hidden');
      }
    }

    function render(list) {
      channelsList.innerHTML = '';
      count.textContent = list.length;
      if (!list.length) {
        channelsList.innerHTML = '<p class="text-slate-500 text-center py-4 text-sm">لا توجد نتائج</p>';
        return;
      }
      list.forEach(ch => {
        const item = document.createElement('div');
        item.className = "border border-slate-800 bg-slate-800/40 hover:bg-slate-800 p-2.5 rounded-xl cursor-pointer flex items-center gap-3 transition";
        item.innerHTML = `
          <div class="w-10 h-10 rounded-lg bg-slate-900 border border-slate-700 flex items-center justify-center overflow-hidden shrink-0">
            ${ch.logo ? `<img src="${ch.logo}" class="w-full h-full object-contain" onerror="this.style.display='none'">` : '📺'}
          </div>
          <div class="flex-1 truncate">
            <p class="text-sm font-semibold text-white truncate">${ch.name}</p>
            <p class="text-xs text-slate-400 truncate">${ch.category} • ${ch.streams_count || 1} سيرفرات</p>
          </div>
        `;
        item.onclick = () => playChannel(ch);
        channelsList.appendChild(item);
      });
    }

    async function init() {
      try {
        const res = await fetch('channels.json');
        if (!res.ok) throw new Error();
        allChannels = await res.json();
        render(allChannels);
      } catch (e) {
        channelsList.innerHTML = '<p class="text-amber-400 text-xs text-center p-4">خطأ في تحميل ملف القنوات</p>';
      }
    }

    searchInput.addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      render(allChannels.filter(c => c.name.toLowerCase().includes(q) || c.category.toLowerCase().includes(q)));
    });

    init();
  </script>
</body>
</html>

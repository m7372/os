    let currentChannel = null;

    const video = document.getElementById('videoPlayer');
    const notice = document.getElementById('notice');
    const noticeText = document.getElementById('noticeText');
    const currentName = document.getElementById('currentName');
    const currentCat = document.getElementById('currentCat');
    const currentLogo = document.getElementById('currentLogo');
    const qualityControls = document.getElementById('qualityControls');
    const channelsList = document.getElementById('channelsList');

    function playStream(streamId, ch) {
      if (!streamId) {
        noticeText.innerHTML = `⚠️ <span class="font-bold text-amber-400">${ch.name}</span><br><span class="text-xs text-slate-400 mt-1 inline-block">سيرفر البث لهذه القناة قيد التحديث في التطبيق</span>`;
        notice.classList.remove('hidden');
        if (hls) hls.destroy();
        video.src = '';
        return;
      }

      noticeText.textContent = 'جاري الاتصال بالبث المباشر...';
      notice.classList.remove('hidden');

      const rawUrl = `${STREAM_BASE}${streamId}.css`;
      const playableUrl = `${WORKER_URL}?url=${encodeURIComponent(rawUrl)}`;

      if (hls) hls.destroy();

      if (Hls.isSupported()) {
        hls = new Hls({ enableWorker: true, lowLatencyMode: true });
        hls.loadSource(playableUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          notice.classList.add('hidden');
          video.play().catch(() => {});
        });
        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            noticeText.innerHTML = 'حدث خطأ أثناء تحميل البث، جرب اختيار جودة أخرى.';
            notice.classList.remove('hidden');
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = playableUrl;
        notice.classList.add('hidden');
        video.play().catch(() => {});
      }
    }

    function selectChannel(ch, quality = null) {
      currentChannel = ch;
      currentName.textContent = ch.name;
      currentCat.textContent = `${ch.flag ? ch.flag + ' ' : ''}${ch.category}`;

      if (ch.logo) {
        currentLogo.innerHTML = `<img src="${ch.logo}" class="w-full h-full object-contain" onerror="this.parentElement.innerHTML='📺'">`;
      } else {
        currentLogo.innerHTML = '📺';
      }

      const availableQualities = Object.keys(ch.streams || {});
      qualityControls.innerHTML = '';

      if (availableQualities.length > 0) {
        currentQuality = (quality && ch.streams[quality]) ? quality : availableQualities[0];
        availableQualities.forEach(q => {
          const btn = document.createElement('button');
          btn.textContent = q;
          btn.className = `px-2.5 py-1 text-xs rounded-lg font-bold transition border ${q === currentQuality ? 'bg-red-500 text-white border-red-500 shadow-sm' : 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700'}`;
          btn.onclick = () => selectChannel(ch, q);
          qualityControls.appendChild(btn);
        });
        playStream(ch.streams[currentQuality], ch);
      } else {
        qualityControls.innerHTML = '<span class="text-xs text-slate-500">تلقائي</span>';
        playStream(null, ch);
      }
    }

    function render(list) {
      channelsList.innerHTML = '';
      count.textContent = list.length;
      
      if (list.length === 0) {
        channelsList.innerHTML = '<p class="text-xs text-slate-400 text-center py-8">لم يتم العثور على قنوات تطابق البحث</p>';
        return;
      }

      list.forEach(ch => {
        const item = document.createElement('div');
        const isCurrent = currentChannel && currentChannel.id === ch.id;
        item.className = `border ${isCurrent ? 'border-red-500 bg-red-500/10' : 'border-slate-800 bg-slate-800/40 hover:bg-slate-800'} p-2.5 rounded-xl cursor-pointer flex items-center justify-between gap-3 transition group`;
        item.innerHTML = `
          <div class="flex items-center gap-3 truncate">
            <div class="w-10 h-10 rounded-lg bg-slate-900 border border-slate-700 flex items-center justify-center overflow-hidden shrink-0">
              ${ch.logo ? `<img src="${ch.logo}" class="w-full h-full object-contain" loading="lazy" onerror="this.style.display='none'">` : '📺'}
            </div>
            <div class="truncate">
              <p class="text-sm font-semibold text-white group-hover:text-red-400 transition truncate">${ch.name}</p>
              <p class="text-xs text-slate-400 truncate">${ch.flag ? ch.flag + ' ' : ''}${ch.category}</p>

        item.onclick = () => selectChannel(ch);

          btn.className = 'cat-btn px-3.5 py-1.5 rounded-lg bg-red-600 text-white font-medium transition shrink-0';
        } else {
          btn.className = 'cat-btn px-3.5 py-1.5 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 font-medium transition shrink-0';
        }
      });
      applyFilters();
    }

    function applyFilters() {
      const q = searchInput.value.toLowerCase().trim();
      const filtered = CHANNELS.filter(c => {
        const matchesCat = (currentCategory === 'all') || (c.category.includes(currentCategory)) || (currentCategory === 'أفلام' && (c.category.includes('أفلام') || c.category.includes('مسلسلات') || c.category.includes('دراما')));
        const matchesQuery = !q || c.name.toLowerCase().includes(q) || c.category.toLowerCase().includes(q);
        return matchesCat && matchesQuery;
      });
      render(filtered);
    }

    searchInput.addEventListener('input', applyFilters);

    render(CHANNELS);
    const firstActive = CHANNELS.find(c => c.active) || CHANNELS[0];
    if (firstActive) selectChannel(firstActive);
  </script>
</body>
</html>
